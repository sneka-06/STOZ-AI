<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>


    <header>

        <h2>MY WEBSITE</h2>

        <nav>

            <a href="./index.html">Home</a>

            <a href="./blog.html">Blog</a>

            <a href="./contact.html">Contact</a>

        </nav>

    </header>


    <section id="contact">

        <div class="container">

            <h1>Contact Us</h1>

            <p class="subtitle">
                Have a question? Send me a message!
            </p>


            <form>

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="mobile">
                        Mobile
                    </label>

                    <input
                        type="tel"
                        id="mobile"
                        placeholder="Enter your mobile number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <button type="submit">
                    Send Message
                </button>


            </form>

        </div>

    </section>


    <footer>

        <p>
            © 2026 My Website. All rights reserved.
        </p>

    </footer>


</body>

</html>
